{% extends 'base/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-lg">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-key text-primary fa-3x mb-3"></i>
                        <h2 class="h4 text-gray-900 mb-2">Reset Password</h2>
                        <p class="text-muted">Enter your contact number to receive an OTP</p>
                    </div>

                    <form method="post" class="needs-validation" novalidate>
                        {% csrf_token %}
                        <div class="form-floating mb-4">
                            <input type="text" name="phone" class="form-control form-control-lg" id="id_phone" placeholder="Enter your phone number" required>
                            <label for="id_phone" class="form-label">Contact Number</label>
                            <div class="invalid-feedback">Please enter your phone number.</div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 py-3 mb-2">
                            Send OTP
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="{% url 'store:customer_login' %}" class="text-decoration-none">
                            <small class="text-muted">Back to login</small>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
  'use strict'
  var forms = document.querySelectorAll('.needs-validation')
  Array.prototype.slice.call(forms).forEach(function (form) {
    form.addEventListener('submit', function (event) {
      if (!form.checkValidity()) {
        event.preventDefault()
        event.stopPropagation()
      }
      form.classList.add('was-validated')
    }, false)
  })
})()
</script>
{% endblock %}
